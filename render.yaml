# Render Blueprint — Staging environment
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this file to your GitHub repo.
#   2. In the Render dashboard → New → Blueprint, point to this repo.
#   3. Render will create both services. Fill in the "sync: false" env vars
#      in each service's Environment tab (see comments below).
#
# Deploy order:
#   - Provision a Neon Postgres database first and copy its connection string.
#   - Deploy the API service, then the UI service (the UI needs the API URL).

services:
  # ── Backend: NestJS API ─────────────────────────────────────────────────────
  - type: web
    name: twitter-clone-api-staging
    runtime: node
    plan: free           # change to "starter" or higher for production
    region: ohio         # US East — match your Neon region for lowest latency
    rootDir: backend/twitter-clone-api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Runs pending TypeORM migrations before each deploy, then starts the app.
    startCommand: node node_modules/typeorm/cli.js migration:run -d dist/data-source.js && node dist/main.js
    healthCheckPath: /api  # Swagger UI is mounted here; confirms app is up
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # ── Database (Neon) ──────────────────────────────────────────────────────
      # Paste the Neon "Pooled connection" string from your Neon project dashboard.
      # Format: postgresql://<user>:<password>@<host>/<dbname>?sslmode=require
      - key: DATABASE_URL
        sync: false       # set manually in the Render dashboard — never commit secrets

      # ── Clerk ────────────────────────────────────────────────────────────────
      # Use your *staging* Clerk application's keys (or the same test keys).
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Set to the Render URL of the frontend service once it is created,
      # e.g. https://twitter-clone-ui-staging.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # ── Frontend: Next.js ───────────────────────────────────────────────────────
  - type: web
    name: twitter-clone-ui-staging
    runtime: node
    plan: free
    region: ohio
    rootDir: frontend/twitter-clone-ui
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm codegen && pnpm build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production

      # ── API URL ───────────────────────────────────────────────────────────────
      # IMPORTANT: NEXT_PUBLIC_* vars are baked in at BUILD time by Next.js.
      # Set this before triggering the first build.
      # Use the Render URL of the API service above,
      # e.g. https://twitter-clone-api-staging.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false

      # ── Clerk ─────────────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

      # ── Clerk redirect URLs (safe to hard-code) ───────────────────────────────
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /
